- name: "Install kubernetes python package"
  pip:
    name: kubernetes
    state: present

- name: "Ensure the restricted gh-runner-kernel-builder namespace exists"
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: gh-runner-kernel-builder
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/enforce-version: latest
          pod-security.kubernetes.io/warn: restricted
          pod-security.kubernetes.io/audit: restricted
    state: present

- name: "Disable service account token automount for the default account"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: default
        namespace: gh-runner-kernel-builder
      automountServiceAccountToken: false

- name: "Set default resource requests and limits for kernel build pods"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: LimitRange
      metadata:
        name: kernel-build
        namespace: gh-runner-kernel-builder
      spec:
        limits:
          - type: Container
            defaultRequest:
              cpu: "{{ kernel_build_cpu_request }}"
              memory: "{{ kernel_build_memory_request }}"
              ephemeral-storage: "{{ kernel_build_ephemeral_storage_request }}"
            default:
              memory: "{{ kernel_build_memory_limit }}"
              ephemeral-storage: "{{ kernel_build_ephemeral_storage_limit }}"
            max:
              memory: "{{ kernel_build_memory_limit }}"
              ephemeral-storage: "{{ kernel_build_ephemeral_storage_limit }}"
          - type: Pod
            max:
              memory: "{{ kernel_build_memory_limit }}"
              ephemeral-storage: "{{ kernel_build_ephemeral_storage_limit }}"

- name: "Check if mitmproxy is deployed in the cluster"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: mitmproxy-ca-cert
    namespace: mitmproxy
  register: mitmproxy_ca_configmap

- name: "Set mitmproxy_enabled fact"
  set_fact:
    mitmproxy_enabled: "{{ mitmproxy_ca_configmap.resources | length > 0 }}"

- name: "Copy mitmproxy CA cert ConfigMap to kernel-builder namespace"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: mitmproxy-ca-cert
        namespace: gh-runner-kernel-builder
      data: "{{ mitmproxy_ca_configmap.resources[0].data }}"
  when: mitmproxy_enabled

- name: "Get private docker registry IP"
  ansible.builtin.set_fact:
    registry_ip: "{{ hostvars[groups['physical_k8s_cluster_nodes'][0]].ansible_host }}"

#This is a dependency for the private container registry
- name: "Build and push the unprivileged kernel builder image"
  shell: |
    set -e
    if [ -n "$EXTRA_CA_CERT_PATH" ]; then
      extra_ca_cert=$(cat "$EXTRA_CA_CERT_PATH")
      set -- --build-arg "EXTRA_CA_CERT=$extra_ca_cert"
    fi
    meta=$(mktemp)
    trap 'rm -f "$meta"' EXIT
    docker build --push --metadata-file "$meta" \
      --build-arg http_proxy \
      --build-arg https_proxy \
      --build-arg no_proxy \
      "$@" \
      -t {{ registry_ip }}:32000/linux-kernel-builder:latest \
      -f Dockerfile.linux-kernel-builder . >&2
    python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$meta"
  args:
    chdir: ./roles/kernel-builder-k8s-job/templates/
  environment:
    EXTRA_CA_CERT_PATH: "{{ corporate_ca_cert_path | default('') | expanduser }}"
  register: kernel_builder_image_push

- name: "Validate the kernel builder image digest"
  ansible.builtin.assert:
    that:
      - kernel_builder_image_push.stdout | trim is match('^sha256:[0-9a-f]{64}$')

- name: "Set the kernel builder image to the pushed digest"
  ansible.builtin.set_fact:
    kernel_builder_image: "container-registry.local:5000/linux-kernel-builder@{{ kernel_builder_image_push.stdout | trim }}"

- name: "Create kernel-build-scripts ConfigMap"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kernel-build-scripts
        namespace: gh-runner-kernel-builder
      data:
        kernel-build-job.sh: "{{ lookup('file', playbook_dir + '/roles/kernel-builder-k8s-job/templates/kernel-build-job.sh') }}"
        build-kernel.sh: "{{ lookup('file', playbook_dir + '/roles/kernel-builder-k8s-job/templates/build-kernel.sh') }}"
        get-base-kernel-artifacts.sh: "{{ lookup('file', playbook_dir + '/roles/kernel-builder-k8s-job/templates/get-base-kernel-artifacts.sh') }}"
        registry.sh: "{{ lookup('file', playbook_dir + '/../.github/actions/kubevirt-action/registry.sh') }}"

- name: "Create the unprivileged nightly kernel build CronJob"
  kubernetes.core.k8s:
    state: present
    template: ../templates/kernel-builder-cronjob.yaml.j2
    force: true

- name: "Remove legacy docker-daemon-config ConfigMap"
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: docker-daemon-config
        namespace: gh-runner-kernel-builder
