- include_vars: ../../../../variables.yaml

- name: "Check that at least one kpd instance is declared"
  assert:
    that:
      - kpd_instances is defined
      - kpd_instances | length > 0
    fail_msg: >-
      kpd_instances is empty or undefined in variables.yaml. kpd is enabled
      (kpd_github_app_id is set) but there is nothing to deploy.

# Names become Kubernetes object names, and a bad one is only rejected by the
# API server, i.e. after the earlier steps have already changed the cluster.
- name: "Validate the kpd instance names"
  assert:
    that:
      - item.name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - item.name | length <= 40
    fail_msg: >-
      kpd instance name '{{ item.name }}' cannot be used as a Kubernetes object
      name. Use lowercase alphanumerics and dashes, at most 40 characters.
  loop: "{{ kpd_instances }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Check that kpd instance names and lock files are unique"
  assert:
    that:
      - kpd_instances | map(attribute='name') | list | unique | length
        == kpd_instances | length
      - kpd_instances | map(attribute='lock_file') | list | unique | length
        == kpd_instances | length
    fail_msg: >-
      Two kpd instances share a name or a lock_file. Duplicate names collide on
      the same Kubernetes objects. A duplicate lock_file means only one of the
      instances ever holds the lock, the others stay in standby forever and pick
      up no series, with nothing in their log to say they are misconfigured.

- name: "Validate the kpd tag_to_branch_mapping entries"
  assert:
    that:
      - item.tag_to_branch_mapping | dict2items | selectattr('value', 'string')
        | list | length == 0
      - item.tag_to_branch_mapping.values() | list | flatten
        | reject('in', item.branches) | list | length == 0
    fail_msg: >-
      kpd instance '{{ item.name }}' has an invalid tag_to_branch_mapping. Every
      value must be a list of branch names defined in its `branches`, but it
      maps to
      {{ item.tag_to_branch_mapping.values() | list | flatten | reject('in', item.branches) | list }}.
      kpd would reject this config on startup.
  loop: "{{ kpd_instances }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Ensure the kernel-patches-daemon namespace exists"
  kubernetes.core.k8s:
    name: kernel-patches-daemon
    api_version: v1
    kind: Namespace
    state: present

- name: "Find the kpd instances currently deployed on this cluster"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: kernel-patches-daemon
    label_selectors:
      - app=kpd
  register: kpd_deployed

- name: "Determine which deployed kpd instances are no longer declared"
  set_fact:
    kpd_orphans: >-
      {{ kpd_deployed.resources | map(attribute='metadata.name') | list
         | difference(kpd_instances | map(attribute='name')
                      | map('regex_replace', '^', 'kpd-') | list) }}

- name: "Check if mitmproxy is deployed in the cluster"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: mitmproxy-ca-cert
    namespace: mitmproxy
  register: mitmproxy_ca_configmap

- name: "Set mitmproxy_enabled fact"
  set_fact:
    mitmproxy_enabled: "{{ mitmproxy_ca_configmap.resources | length > 0 }}"

- name: "Copy mitmproxy CA cert ConfigMap to kpd namespace"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: mitmproxy-ca-cert
        namespace: kernel-patches-daemon
      data: "{{ mitmproxy_ca_configmap.resources[0].data }}"
  when: mitmproxy_enabled

# The image and the config files baked into it are the same for every instance,
# so this runs once no matter how many instances are deployed. It is also the
# step most likely to fail, which is why nothing is torn down before it.
- name: "Build the shared kpd image"
  include_tasks: image.yaml

# Everything below replaces running daemons, so it only starts once the image is
# in the registry and the instance list has been validated.

# Superseded by the per-instance kpd-<name> objects. Left running, the old
# daemon would answer to this cluster's name on the same lock file as the
# linux-block instance, so both would consider the lock theirs and go active.
# `wait` matters: the pod has to be gone, and its lock released, before its
# replacement comes up.
- name: "Remove the pre-multi-instance kpd objects"
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: kernel-patches-daemon
    wait: true
    wait_timeout: 180
  loop:
    - {api_version: apps/v1, kind: Deployment, name: kernel-patches-daemon}
    - {api_version: v1, kind: Secret, name: kpd-config}
    - {api_version: v1, kind: ConfigMap, name: kpd-leader-election}
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"

# Renaming an instance would otherwise leave the old daemon running forever,
# holding a lock nothing refreshes or, worse, still working the same fork.
- name: "Remove kpd instances that are no longer declared in kpd_instances"
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.1.api_version }}"
    kind: "{{ item.1.kind }}"
    name: "{{ item.0 }}{{ item.1.suffix }}"
    namespace: kernel-patches-daemon
    wait: true
    wait_timeout: 180
  loop: >-
    {{ kpd_orphans | product([
         {'api_version': 'apps/v1', 'kind': 'Deployment', 'suffix': ''},
         {'api_version': 'v1', 'kind': 'Secret', 'suffix': '-config'},
         {'api_version': 'v1', 'kind': 'ConfigMap', 'suffix': '-leader-election'},
       ]) | list }}
  loop_control:
    label: "{{ item.1.kind }}/{{ item.0 }}{{ item.1.suffix }}"

- name: "Deploy the kpd instances"
  include_tasks: instance.yaml
  loop: "{{ kpd_instances }}"
  loop_control:
    loop_var: instance
    label: "{{ instance.name }}"
